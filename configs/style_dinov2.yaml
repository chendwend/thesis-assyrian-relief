experiment:
  name: only_3_classes
  seed: 42
  deterministic: false


random_seed: 24

data:
  dataset_type: core_train
  classes: ["Ashurbanipal", "Ashurnasirpal II", "Sargon II"]
  dataset_xlsx: ~/gdrive/Graduate_Studies/Thesis/Dataset/main.xlsx
  csv_path: data/splits/image_level_dataset_v2.csv
  image_root: /mnt/c/Users/chend/Desktop/My_Files/Thesis/Dataset/dataset_v2
  filename_sep: "-"

splits:
  train: train
  val: val
  test: test
  train_size: 0.7
  val_size: 0.2
  test_size: 0.1

model:
  model_name: dinov2_vits14
  emb_dim: 256
  dropout: 0.2
  freeze_backbone: true
  pretrained: true

train:
  batch_size: 16
  num_workers: 2
  num_epochs: 50
  lr: 0.001
  weight_decay: 0.0001

early_stopping:
  enabled: true
  patience: 6
  monitor: val_macro_f1
  mode: max
  min_delta: 0.001


optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

loss:
  name: cross_entropy
  class_weighting: balanced

# loss:
#   name: ce_supcon
#   class_weighting: balanced
#   ce_weight: 1.0
#   supcon_weight: 0.1
#   supcon_temperature: 0.07

scheduler:
  enabled: true
  name: reduce_on_plateau
  monitor: val_macro_f1
  mode: max
  factor: 0.5
  patience: 2

evaluation:
  relief_aggregation: mean_logits
  loss_class_weighting: none


  umap:
    fit_split: train
    plot_splits: [train, val, test]
    highlight_relief_ids: []
    n_neighbors: 10
    min_dist: 0.2
    metric: cosine
    random_seed: 42



  
  
