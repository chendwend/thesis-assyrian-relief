experiment:
  name: three_ruler_grouped_pad_seed24
  seed: 24
  deterministic: true
data:
  csv_path: data/splits/image_level_dataset_v2_grouped.csv
  image_root: /home/kostya/projects/dataset_v2
  filename_sep: '-'
  resize_mode: pad
splits:
  train: train
  val: val
  test: test
model:
  model_name: dinov2_vits14
  emb_dim: 256
train:
  batch_size: 16
  num_workers: 0
  num_epochs: 50
early_stopping:
  enabled: true
  patience: 6
  monitor: val_macro_f1
  mode: max
  min_delta: 0.001
checkpoint:
  monitor: val_macro_f1
  mode: max
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
loss:
  name: cross_entropy
  class_weighting: balanced
scheduler:
  enabled: true
  name: reduce_on_plateau
  monitor: val_macro_f1
  mode: max
  factor: 0.5
  patience: 2
evaluation:
  relief_aggregation: mean_logits
  loss_class_weighting: none
outputs:
  checkpoint_path: outputs/grouped_pad_seed24/checkpoints/dinov2_probe.pt
  history_path: outputs/grouped_pad_seed24/checkpoints/dinov2_probe.history.csv
  training_curve_path: outputs/grouped_pad_seed24/plots/train_curves.png
